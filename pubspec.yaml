name: go_router_builder
description: >-
  A builder that supports generated strongly-typed route helpers for
  package:go_router
version: 4.5.0
repository: https://github.com/flutter/packages/tree/main/packages/go_router_builder
issue_tracker: https://github.com/flutter/flutter/issues?q=is%3Aissue+is%3Aopen+label%3A%22p%3A+go_router_builder%22

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  analyzer: ">=13.2.0 <15.0.0"
  async: ^2.13.1
  # TODO(piinks): Pin version once new stable rolls.
  build: ">=4.0.0 <5.0.0"
  build_config: ^1.3.3
  collection: ^1.19.1
  meta: ^1.19.0
  path: ^1.9.1
  source_gen: ">=4.2.3 <5.0.0"
  source_helper: ^1.3.13

dev_dependencies:
  build_test: ^3.5.20
  dart_style: ">=2.3.7 <4.0.0"
  flutter:
    sdk: flutter
  go_router: 
    git: https://github.com/kumsumit/go_router.git
  leak_tracker_flutter_testing: ">=3.0.0"
  logging: ^1.3.0
  package_config: ^3.0.0
  pub_semver: ^2.2.1
  test: ^1.32.0

topics:
  - codegen
  - deep-linking
  - go-router
  - navigation
